version: "3.9"

services:

  frontend-admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
    container_name: frontend-admin
    ports:
      - "3000:80"
    networks:
      - microservices-net
    restart: unless-stopped

  frontend-customer:
    build:
      context: ./frontend-customer
      dockerfile: Dockerfile
    container_name: frontend-customer
    ports:
      - "3001:80"
    networks:
      - microservices-net
    restart: unless-stopped

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "3010:3010"
    networks:
      - microservices-net
    restart: unless-stopped
    environment:
      - PORT=3010

  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: product-service
    ports:
      - "3020:3020"
    networks:
      - microservices-net
    restart: unless-stopped
    environment:
      - PORT=3020

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      - "3030:3030"
    networks:
      - microservices-net
    restart: unless-stopped
    environment:
      - PORT=3030

networks:
  microservices-net:
    driver: bridge
