name: Microservices CI/CD

on:
  push:
    branches:
      - develop
      - feature/*

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      # USER SERVICE
      - name: Build & Push user-service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/user-service:latest ./user-service
          docker push ${{ secrets.DOCKER_USERNAME }}/user-service:latest

      # PRODUCT SERVICE
      - name: Build & Push product-service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/product-service:latest ./product-service
          docker push ${{ secrets.DOCKER_USERNAME }}/product-service:latest

      # ORDER SERVICE
      - name: Build & Push order-service
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/order-service:latest ./order-service
          docker push ${{ secrets.DOCKER_USERNAME }}/order-service:latest

      # FRONTEND ADMIN
      - name: Build & Push frontend-admin
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/frontend-admin:latest ./frontend-admin
          docker push ${{ secrets.DOCKER_USERNAME }}/frontend-admin:latest

      # FRONTEND CUSTOMER
      - name: Build & Push frontend-customer
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/frontend-customer:latest ./frontend-customer
          docker push ${{ secrets.DOCKER_USERNAME }}/frontend-customer:latest
