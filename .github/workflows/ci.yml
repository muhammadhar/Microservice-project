name: Microservices CI/CD v2

on:
  push:
    branches:
      - develop
      - main
  pull_request:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Debug: Check secrets availability (SAFE)
      - name: Debug Secrets Presence
        run: |
          if [ -z "${{ secrets.DOCKER_USERNAME }}" ]; then
            echo "❌ DOCKER_USERNAME is NOT set"
            exit 1
          else
            echo "✅ DOCKER_USERNAME is set"
          fi

          if [ -z "${{ secrets.DOCKER_PASSWORD }}" ]; then
            echo "❌ DOCKER_PASSWORD is NOT set"
            exit 1
          else
            echo "✅ DOCKER_PASSWORD is set"
          fi

      # 3. Login to Docker Hub
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 4. Debug login (verify authentication)
      - name: Verify Docker Login
        run: docker info

      # 5. Build images for each service
      - name: Build User Service
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/user-service:latest ./user-service

      - name: Build Order Service
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/order-service:latest ./order-service

      - name: Build Product Service
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/product-service:latest ./product-service

      # 6. Push images
      - name: Push User Service
        run: docker push ${{ secrets.DOCKER_USERNAME }}/user-service:latest

      - name: Push Order Service
        run: docker push ${{ secrets.DOCKER_USERNAME }}/order-service:latest

      - name: Push Product Service
        run: docker push ${{ secrets.DOCKER_USERNAME }}/product-service:latest
